slug: a-cargo-box-on-the-trailer
name: Camper shell
prompt: 'A cargo box on the trailer hitch behind my Nissan Leaf. The box is 74 in
  wide, 41 in high and 39 in deep, with its front face 18 in behind the rear bumper.
  It sits on a frame of 2 in square steel tube whose shank slides into the hitch receiver.
  The receiver is a Class II hitch, about 9 in off the ground and 3 in forward of
  the rear bumper (the bumper sticks out 3 in behind it). The Leaf is about 70.5 in
  wide with its roof about 60 in off the ground, and its back is a teardrop / hatchback
  shape. The hatch must still open: its swing reaches about 14 in behind the bumper
  at its furthest. The box is XPS foam covered in poor man''s fiberglass, with a door
  and a roof fan. I want to shape it for less drag.'
units: mm
display_units: in
requirements:
- question: How long is the hitch shank (the horizontal tube from the receiver face
    to where the box frame begins), and what is the receiver drop/rise needed to set
    the box at your target height?
  answer: 21 in from the receiver mouth back to the box's front edge (3 in to the
    bumper + the 18 in gap); straight, no riser for now
  source: answered
  at: '2026-10-27T21:37:43.209331+00:00'
- question: What height off the ground do you want the bottom of the box to sit?
  answer: '18 in off the ground: a riser on the shank lifts the frame''s ladder to
    16-18 in (better ground clearance; the top stays under the 60 in roof)'
  source: answered
  at: '2026-10-28T02:54:47.088025+00:00'
- question: Is the access door on the rear face, one of the sides, or the top of the
    box?
  answer: "Not decided yet \u2014 leaving the door for later"
  source: answered
  at: '2026-10-28T02:54:40.419515+00:00'
- question: What is the diameter and intended position (centered, offset toward rear,
    etc.) of the roof fan cutout?
  answer: 6 in diameter, centered on the roof panel
  source: assumed
  at: '2026-10-27T21:37:43.215962+00:00'
- question: What is the maximum total depth (front-to-rear) you can accept for the
    whole unit, including any boat-tail taper added behind the 39 in box?
  answer: 39 in total; drag shaping stays within the 39 in depth (a longer box also
    lengthens the lever on the hitch)
  source: answered
  at: '2026-10-27T21:37:43.217563+00:00'
- question: What has to fit inside? (camper box)
  answer: 'A mattress on the floor: the floor must stay a flat 74 x 39 in rectangle
    at 18 in, with straight side walls up to at least 12 in above it. Everything above
    may change.'
  source: answered
  at: '2026-10-28T02:54:40.424450+00:00'
- question: What loads does the frame carry? (load cases)
  answer: 'Driving: the box + gear, about 100 lb total, on the platform, x2.5 for
    bumps, carried by the hitch receiver alone (no legs yet). Sleeping (300 lb, parked)
    comes later, with legs.'
  source: answered
  at: '2026-10-28T03:29:28.525515+00:00'
- question: Does the hatch need to open with the box on?
  answer: "No \u2014 the trunk is reached from inside, through the fold-down rear\
    \ seat. The box can sit a few inches behind the bumper: 3 in, with at least 2\
    \ in kept clear."
  source: answered
  at: '2026-10-28T17:46:58.446672+00:00'
- question: What's in the box when driving?
  answer: About 50 lb of gear on the floor.
  source: answered
  at: '2026-10-28T17:46:58.449059+00:00'
- question: What is the hitch rated for?
  answer: "350 lb tongue weight (a Class III option does 800 lb). Keep dynamic loads\
    \ under ~3.5x the standing load; the lever-arm (moment) limit is set aside for\
    \ now \u2014 Theo will test the spine."
  source: answered
  at: '2026-10-28T20:59:02.619633+00:00'
- question: What does the frame have to hold when parked?
  answer: Jacks at the back carry the back when parked; under 350 lb total with Theo
    in it.
  source: answered
  at: '2026-10-28T20:59:02.622325+00:00'
- question: How much snow must the roof carry?
  answer: "20 lb/ft\xB2 (about 20 in of snow at 1 lb/ft\xB2 per inch) \u2014 he won't\
    \ let more pile up."
  source: answered
  at: '2026-10-28T20:59:02.625343+00:00'
- question: How much can the hitch's tongue take?
  answer: "Rated 350 lb, set conservatively (likely safe at 2x); use 420 lb \u2014\
    \ the rating + 20%. No front jacks: the back jacks are already a bit overkill."
  source: answered
  at: '2026-10-28T22:22:57.259146+00:00'
