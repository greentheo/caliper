  <text x="48.768" y="1522.6272" fill="#5a6472">Marked side faces OUT; mountain and valley are named as seen from it. Glue tabs fold under, to the inside. This is an open surface, so which face is out comes from the model's own winding and</text>
  <text x="48.768" y="1552.6272" fill="#5a6472">cannot be checked — a bowl and a dome are the same triangles. If it is inverted, every fold is inverted together: hold one panel against the model before creasing the rest.</text>
