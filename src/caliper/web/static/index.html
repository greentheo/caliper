<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caliper</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/design.css?v=3" />
  <script>
    // surface load/runtime errors on the page itself, not just devtools (CALI-27): a failed module
    // import would otherwise leave every button silently dead.
    window.__err = [];
    function showErr(msg) {
      __err.push(msg);
      const b = document.getElementById('errbar');
      if (b) { b.hidden = false; b.textContent = '⚠ ' + msg; }
    }
    addEventListener('error', (e) => {
      if (/ResizeObserver loop/.test(e.message || '')) return;   // benign canvas-resize noise
      showErr((e.message || e.type) + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
    });
    addEventListener('unhandledrejection', (e) => showErr('promise: ' + (e.reason && e.reason.message || e.reason)));
  </script>
  <!-- three.js vendored locally (no CDN, works offline) via import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <h1>Caliper</h1>
    <select id="designPick" title="your designs"></select>
    <button id="newBtn" class="ghost">+ New design</button>
    <span class="spacer"></span>
    <div class="seg" id="unitSeg" title="how numbers are shown (the model is always mm)">
      <button data-u="in">in</button><button data-u="mm">mm</button>
    </div>
    <span id="whittleDot" class="dot" title="whittle">whittle</span>
    <a class="ghostlink" href="/classic" title="the old control panel">classic</a>
  </header>
  <div id="errbar" class="errbar" hidden></div>

  <main class="session">
    <section class="chat">
      <div id="thread" class="thread"></div>
      <form id="composer" class="composer" autocomplete="off">
        <div id="scopeRow" class="scope-row" hidden>
          <span class="muted small">talking about</span>
          <span id="scopeChip" class="chip"></span>
          <button type="button" id="scopeClear" class="x" title="back to the whole design">×</button>
        </div>
        <div class="composer-row">
          <textarea id="msg" rows="2" placeholder="Click a part to talk about it, or describe a change…"></textarea>
          <button id="send" class="primary" type="submit">Send</button>
        </div>
      </form>
    </section>

    <section class="view">
      <div id="viewer"></div>
      <div id="tip" class="tip" hidden></div>
      <div id="stationBar" class="station-bar" hidden></div>
      <div class="viewbar">
        <button id="fitView" class="ghost" title="fit everything in view (F)">⤢ fit</button>
        <span id="viewHint" class="muted small"></span>
      </div>
    </section>

    <aside id="inspector" class="inspector"></aside>
  </main>

  <script type="module" src="/design.js?v=3"></script>
</body>
</html>
