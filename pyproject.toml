[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper"
version = "0.0.1"
description = "Spec-driven, measurement-grounded generation of manufacturable 3D parts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
# Runtime deps are managed via conda (environment.yml); listed here for reference/pip installs.
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "trimesh",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
caliper = "caliper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caliper = ["web/static/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
