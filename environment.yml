name: caliper
# Caliper dev environment.
# Only CadQuery/OCCT genuinely needs conda (native OCCT build); strict conda-forge priority keeps
# the solve fast. Everything else installs via pip on top.
# Create:  conda env create -f environment.yml   (uses strict conda-forge below)
# If the classic solver is slow, the equivalent fast imperative form is:
#   conda create -n caliper -c conda-forge --override-channels --strict-channel-priority \
#       -y python=3.11 cadquery && conda run -n caliper pip install -r requirements-pip.txt
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cadquery            # parametric B-rep generator (brings OCCT/OCP, vtk, numpy)
  - pip
  - pip:
      - trimesh         # mesh measurements + STL I/O
      - rtree           # spatial index for trimesh ray casting (min_wall_thickness)
      - scipy           # continuous optimizer (scipy.optimize)
      - manifold3d      # robust booleans (interference / clearance, M3)
      - pydantic>=2     # typed spec schema
      - pyyaml          # spec (de)serialization
      - rich            # CLI/report output
      - pytest          # regression guard
      - shapely         # 2D geometry helpers (plasma flat-pattern, later)
      - nevergrad       # discrete/black-box search (later milestones)
      - anthropic       # Claude API: intake + decide
      - fastapi         # M2 webapp backend
      - uvicorn         # ASGI server for M2
