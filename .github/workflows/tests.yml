# The regression guard on every PR and on main: the same environment as the local recipe in README
# (micromamba for CadQuery/OCCT, pip for the rest), plus the two optional tools so their tests run too —
# whittle (studies) and unfold-to-sheets (cut plans, on node), via `make tools`.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - name: GL libraries for OCCT/VTK on a headless runner
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1 libegl1 libglu1-mesa

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: caliper
          create-args: python=3.11 cadquery
          cache-environment: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install -r requirements-pip.txt
          python -m pip install -e . --no-deps

      - name: The optional tools, at the refs the Makefile pins
        run: make tools CALIPER_PY=python

      - name: Test
        env:
          CALIPER_CHROME: none          # no headless Chrome here: build books skip the PDF
        run: python -m pytest
