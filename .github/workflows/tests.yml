# The regression guard on every PR and on main: the same environment as the local recipe in README
# (micromamba for CadQuery/OCCT, pip for the rest), plus the two optional tools so their tests run too —
# whittle (studies) and unfold-to-sheets (cut plans, on node), via `make tools`.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 90             # a margin over the parallel run (CALI-114): #106 hit the 60-min cap at 84%
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: caliper
          # The GL libraries OCCT/VTK load on a headless runner come from conda-forge too, not apt: on 2026-11-11
          # the runners couldn't resolve the Ubuntu mirrors, and every run died installing them.
          create-args: python=3.11 cadquery libgl libegl libglu
          cache-environment: true

      - name: GL libraries for OCCT/VTK on a headless runner (apt only if the env above left one out)
        run: |
          missing() {
            python -c "import cadquery, OCP, vtkmodules.vtkRenderingOpenGL2" >/dev/null 2>"$RUNNER_TEMP/gl.err" \
              || tail -1 "$RUNNER_TEMP/gl.err"
            find "$CONDA_PREFIX/lib" \( -name 'OCP*.so' -o -name 'vtkRenderingOpenGL2*.so' \) -print0 \
              | xargs -0 -r ldd 2>/dev/null | grep "not found" | sort -u
          }
          gone=$(missing)
          if [ -z "$gone" ]; then echo "GL: everything loads from the env"; exit 0; fi
          echo "GL: missing from the env, trying apt:"; echo "$gone"
          for try in 1 2 3; do
            timeout 300 sudo apt-get -o Acquire::Retries=3 update -q \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 install -y -q libgl1 libegl1 libglu1-mesa && break
            sleep 30
          done
          gone=$(missing)
          if [ -n "$gone" ]; then echo "GL: still missing:"; echo "$gone"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install -r requirements-pip.txt
          python -m pip install -e . --no-deps

      - name: The optional tools, at the refs the Makefile pins
        run: make tools CALIPER_PY=python

      - name: Test, across the runner's cores (CALI-114)
        env:
          CALIPER_CHROME: none          # no headless Chrome here: build books skip the PDF
          # one BLAS thread per worker, so the FEA in four workers doesn't fight over four cores
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: python -m pytest -n auto --durations=25 -m "not serial"

      - name: Test what can't share, on its own
        env:
          CALIPER_CHROME: none
        run: python -m pytest -m serial --durations=10 || test $? -eq 5      # 5: no serial tests yet
